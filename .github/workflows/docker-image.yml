name: Docker Image CI

on:
  push:
    branches:
      - "v*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # nothing is pushed from here, so the name only has to be valid: no secrets needed
  BBSD_IMAGE: ${{ github.repository_owner }}/lbbs-bbsd

jobs:

  # One native runner per architecture. QEMU would emulate the arm64 toolchain,
  # which dominates the wall time of a compute-heavy build like this one.
  build:

    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract Docker metadata (bbsd)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.BBSD_IMAGE }}

    - name: Build the Docker image (bbsd)
      uses: docker/build-push-action@v7
      with:
        platforms: ${{ matrix.platform }}
        context: .
        file: ./Dockerfile/dockerfile.bbsd
        # Publishing happens in docker-publish.yml on a version tag
        push: false
        tags: |
          ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # scope keeps the layers of the two architectures from evicting each other
        cache-from: type=gha,scope=bbsd-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=bbsd-${{ matrix.arch }}
