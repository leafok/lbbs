name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"

# Each platform is uploaded as a separate manifest, so cancelling halfway through
# would leave the tag pointing at an incomplete manifest list
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # the namespace must be the account the token belongs to, which need not be the GitHub owner
  BBSD_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lbbs-bbsd

jobs:

  # One native runner per architecture, so the arm64 toolchain is never emulated: under
  # QEMU the make stage alone took 325s against 19s on amd64, and the two platforms now
  # build in parallel instead of one after the other in a ~16 minute single job.
  build:

    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      attestations: write
      id-token: write # Required by the provenance and SBOM attestations

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BBSD_IMAGE }}
          # the per-platform tag that the publish job merges into the release tags
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}

      - name: Build and push the platform image
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile/dockerfile.bbsd
          push: true
          # min attests the exported image only; max also records every internal buildx
          # step as a subject, which for this build is the whole compile
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope keeps the layers of the two architectures from evicting each other
          cache-from: type=gha,scope=bbsd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bbsd-${{ matrix.arch }}

  publish:
    name: Publish the manifest list
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BBSD_IMAGE }}
          # v1.8.0 becomes 1.8.0 and 1.8, plus the commit and the moving latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Merge the platform images
        run: |
          set -eu
          # the platform manifests are copied unchanged, so the attestations already
          # pushed for each of their digests stay reachable through the new tags
          args=()
          while IFS= read -r tag; do
          	if [ -n "${tag}" ]; then
          		args+=(--tag "${tag}")
          	fi
          done <<< "${{ steps.meta.outputs.tags }}"
          for arch in amd64 arm64; do
          	args+=("${BBSD_IMAGE}:${GITHUB_REF_NAME}-${arch}")
          done
          echo "Creating the manifest list from: ${args[*]}"
          # a tag already pointing at this exact list is a no-op, so re-running is safe
          docker buildx imagetools create "${args[@]}"

  # The per-architecture tags are only inputs for the merge above. Removing them keeps the
  # repository listing to what users actually pull; the merged index references the same
  # manifests by digest, so their blobs survive as long as the release tags do.
  cleanup:

    name: Remove the platform tags
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Delete the platform tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          # the release tag pushed by the job above is the version without the v prefix
          release="${GITHUB_REF_NAME#v}"
          # nothing is deleted until the merged release tag resolves
          docker buildx imagetools inspect --raw "${BBSD_IMAGE}:${release}" > /dev/null
          # a token without the delete permission is refused here, which is the point
          token="$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
          	"https://auth.docker.io/token?service=registry.docker.io&scope=repository:${BBSD_IMAGE}:delete,push" |
          	jq -r .token)"
          for arch in amd64 arm64; do
          	ref="${GITHUB_REF_NAME}-${arch}"
          	curl -fsS -X DELETE -o /dev/null \
          		-H "Authorization: Bearer ${token}" \
          		"https://registry-1.docker.io/v2/${BBSD_IMAGE}/manifests/${ref}"
          	echo "Deleted ${BBSD_IMAGE}:${ref}"
          done
